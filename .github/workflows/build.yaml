name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mpi:
    name: MPI backend
    runs-on: ubuntu-latest

    env:
      CC: mpicc
      FC: mpifort
      MPICC: mpicc
      HDF5_MPI: "ON"
      HDF5_PKGCONFIG_NAME: hdf5-openmpi
      CMAKE_ARGS: "-DWAVEFRONT_BACKEND=OFF"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gfortran \
            openmpi-bin \
            libopenmpi-dev \
            libhdf5-openmpi-dev \
            libfftw3-dev \
            libfftw3-mpi-dev \
            pkg-config

      - name: Install MPI Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-binary=mpi4py mpi4py
          python -m pip install --no-binary=h5py h5py

      - name: Build and install QuOp_MPI
        run: |
          python -m pip install ".[test]"
          python -m pip check

      - name: Run unit tests
        run: ./run_tests.sh 1 unit

      - name: Run MPI tests
        run: ./run_tests.sh 2 mpi