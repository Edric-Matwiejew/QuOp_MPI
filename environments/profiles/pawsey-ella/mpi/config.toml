[profile]
description = "Pawsey Ella 2026.11 (Grace CPU, Open MPI)"
wavefront_supported = true
python_version = "3.11"

[install]
root = ".quop-install"
venv_dir = ".venv_{profile}_{backend}"
work_dir = ".cache/quop/{profile}/{backend}"

[modules]
common = [
    "pawseyenv/2026.11",
    "gcc/13.3.1",
    "openmpi/5.0.11",
    "hdf5/1.14.5-parallel-api-v112",
    "fftw/3.3.10",
    "python/3.11.6",
    "py-pip/23.1.2-py3.11.6",
    "py-mpi4py/4.0.1-py3.11.6",
    "cmake/3.31.7",
]

[build]
mpi_build_type = "Release"

[compilers]
cc = "gcc"
cxx = "g++"
fc = "gfortran"
mpi_cc_wrapper = "mpicc"
mpi_cxx_wrapper = "mpicxx"
mpi_fc_wrapper = "mpifort"

[benchmarks]
scheduler = "slurm"
walltime = "00:20:00"
ranks_per_node = 1
intra_sequence = [1]
multi_nodes = [1, 2]

[benchmarks.qaoa]
args_intra = [1024, 4096, 16384]
args_multi = [16384]

[benchmarks.qwoa]
args_intra = [1024, 4096, 16384]
args_multi = [16384]

[benchmarks.qmoa]
args_intra = ["2 2 2 2", "3 3 3"]
args_multi = ["3 3 3"]
