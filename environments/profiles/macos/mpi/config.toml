[profile]
description = "macOS (Homebrew, MPI only)"
wavefront_supported = false
python_version = "3.11"

[install]
root = ".quop-install"
venv_dir = ".venv_{profile}_{backend}"
work_dir = ".cache/quop/{profile}/{backend}"

[compilers]
cc = "gcc-15"
cxx = "g++-15"
fc = "gfortran-15"

[homebrew]
# Homebrew prefix is auto-detected; override here if needed.
# prefix = "/opt/homebrew"

# Formula names for MPI-enabled HDF5 and FFTW.
hdf5_formula = "hdf5-mpi"
fftw_formula = "fftw"

[benchmarks]
scheduler = "local"
ranks_per_node = 4
intra_sequence = [1, 2, 4]

[benchmarks.qaoa]
args_intra = [1024, 4096, 16384]

[benchmarks.qwoa]
args_intra = [1024, 4096, 16384]

[benchmarks.qmoa]
args_intra = ["2 2 2 2", "3 3 3"]
